<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Logros - ACAASO</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="bg-light">

<div class="d-flex" style="min-height:100vh;">

    <!-- SIDEBAR -->
    <aside style="width:260px;" class="bg-white border-end shadow-sm d-flex flex-column">

        <!-- Logo -->
        <div class="text-center py-4 border-bottom">

            <i class="fas fa-graduation-cap text-primary fa-3x mb-3"></i>

            <h4 class="fw-bold mb-0">
                ACAASO
            </h4>

            <small class="text-muted">
                Student Portal
            </small>

        </div>

        <!-- Menú -->

        <div class="p-3">

            <div class="list-group list-group-flush">

                <a href="#" class="list-group-item list-group-item-action active rounded mb-2">

                    <i class="fas fa-trophy me-2"></i>

                    Logros

                </a>

                <a href="#" class="list-group-item list-group-item-action rounded mb-2">

                    <i class="fas fa-book-open me-2"></i>

                    Quizzes Públicos

                </a>

            </div>

        </div>

        <!-- Parte inferior -->

        <div class="mt-auto p-3 border-top">

            <button class="btn btn-outline-danger w-100">

                <i class="fas fa-right-from-bracket me-2"></i>

                Salir

            </button>

        </div>

    </aside>

    <!-- CONTENIDO -->
    <main class="flex-grow-1">

        <!-- TOPBAR -->
        

        <!-- CONTENIDO CENTRAL -->
        <section class="container-fluid px-4 pt-4 pb-3">

            <div class="row align-items-center mb-4">

                <div class="col-lg-7">

                    <div class="d-flex align-items-center">

                        <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
                            style="width:58px;height:58px;background:#eef4ff;">

                            <i class="fas fa-trophy"
                            style="font-size:28px;color:#2f6fed;"></i>

                        </div>

                        <div>

                            <h2 class="fw-bold mb-1">
                                Mis Logros
                            </h2>

                            <div class="text-muted">
                                Aquí puedes ver los quizzes que has completado y tu progreso.
                            </div>

                        </div>

                    </div>

                </div>

                <div class="col-lg-5 text-end">

                    <div style="height:150px;"></div>

                </div>

            </div>
            <section class="container-fluid px-4 pt-4 pb-3">

                <div class="row align-items-center mb-4">

                    ... aquí está tu cabecera ...

                </div>

                <!-- PEGAR AQUÍ -->

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <div class="d-flex align-items-center">

                        <div class="rounded-circle d-flex align-items-center justify-content-center me-3"
                            style="width:42px;height:42px;background:#eef4ff;">

                            <i class="fas fa-compass text-primary"></i>

                        </div>

                        <div>

                            <h5 class="fw-bold mb-0">
                                Quizzes Completados
                            </h5>

                            <small class="text-muted">
                                Tus evaluaciones realizadas.
                            </small>

                        </div>

                    </div>

                    <a href="#" class="text-decoration-none fw-semibold">
                        Ver todos →
                    </a>

                </div>

            </section>
            <div class="row g-4">

                <div class="col-lg-3 col-md-6">

                    <div class="card border-0 shadow-sm h-100" style="border-radius:18px;">

                        <div class="card-body">

                            <div class="d-flex justify-content-between align-items-start">

                                <div class="rounded-circle d-flex align-items-center justify-content-center"
                                    style="width:64px;height:64px;background:#eef5ff;">

                                    <i class="fas fa-clipboard-check fa-2x text-primary"></i>

                                </div>

                                <span class="badge rounded-pill bg-success-subtle text-success px-3 py-2">
                                    92%
                                </span>

                            </div>

                            <h5 class="mt-4 mb-1 fw-bold">
                                Biología Celular
                            </h5>

                            <div class="text-muted mb-3">
                                Ciencias
                            </div>

                            <small class="text-muted d-block">
                                Completado el 27 Jun 2026
                            </small>

                            <small class="text-muted d-block mb-4">
                                1 intento
                            </small>

                            <button class="btn btn-light w-100 fw-semibold">
                                Ver intentos →
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>

</html>
