<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso Alumno</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f8ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card-login{
            width:380px;
            padding:35px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
            background:white;
        }

        .logo{
            width:90px;
            display:block;
            margin:auto;
            margin-bottom:20px;
        }

        h3{
            text-align:center;
            color:#123a8d;
            margin-bottom:25px;
            font-weight:bold;
        }

        .btn-primary{
            width:100%;
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="card-login">

    <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">

    <h3>Ingreso de Alumno</h3>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label>DNI</label>

            <input
                type="text"
                name="dni"
                class="form-control"
                placeholder="Ingrese su DNI"
                required>

        </div>

        <button class="btn btn-primary">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
