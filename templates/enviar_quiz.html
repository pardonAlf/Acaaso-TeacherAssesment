{% extends "base.html" %}

{% block title %}Enviar Quiz{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-2 header-mini">

    <div class="d-flex align-items-center gap-2" style="font-size:14px;">

        <!-- 🔙 VOLVER -->
        <button class="btn btn-sm btn-outline-secondary"
                onclick="window.location.href='/dashboard_profesor'">
            ←
        </button>

        <span style="color:#0d6efd; font-weight:600; font-size:16px;"><b>Enviar Quiz</b> </span> 
        

        <span class="text-muted">|</span>

        <span>{{ titulo_quiz }}</span>

        <span class="text-muted">|</span>

        <span style="color:tomato; font-weight:800;">
            {{ codigo_quiz }}
        </span>

    </div>

    <button class="btn btn-primary btn-sm" onclick="enviar()">
        Enviar Código
    </button>

</div>

<div class="d-flex align-items-center gap-2 mb-2 flex-wrap">

    <!-- 🔹 SALÓN -->
    <div style="position:relative; min-width:520px;">
        <input type="text" id="filtroSalon"
               class="form-control form-control-sm"
               placeholder="Salón...">

        <div id="listaSalones"></div>
    </div>

    <!-- 🔹 DNI / NOMBRE -->
    <div style="position:relative; width:200px;">

        <input type="text"
               id="filtro"
               class="form-control form-control-sm"
               placeholder="DNI o nombre...">

        <div id="listaAlumnos" style=" #listaAlumnos{
                position:absolute;
                width:450px;
                max-height:250px;
                overflow-y:auto;
                z-index:999;
                background:white;
                border:1px solid #ddd; "></div>

    </div>

    <!-- 🔹 BOTÓN -->
    <button class="btn btn-sm btn-outline-primary"
            onclick="seleccionarVisibles()">
        Seleccionar
    </button>

</div>

<table class="table table-sm table-bordered" id="tablaAlumnos">
    <thead>
        <tr>
            <th></th>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Correo</th>
        </tr>
    </thead>
    <tbody>
        {% for a in alumnos %}
        <tr>
            <td><input type="checkbox" value="{{ a[0] }}"></td>
            <td>{{ a[3] }}</td>
            <td>{{ a[1] }} {{ a[2] }}</td>
            <td>{{ a[4] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="mt-2">
    <button class="btn btn-primary btn-sm  " onclick="enviar()">
        Enviar Código
    </button>
</div>
<script>
const alumnosSeleccionados = new Set();

document.querySelectorAll('#tablaAlumnos input[type="checkbox"]').forEach(registrarCheckbox);

document.querySelectorAll("#tablaAlumnos tbody tr").forEach(fila => {
    fila.dataset.origen = "inicial";
});

function limpiarOrigen(origen) {

    let filas = document.querySelectorAll("#tablaAlumnos tbody tr");

    filas.forEach(fila => {

        if (fila.dataset.origen !== origen)
            return;

        let chk = fila.querySelector('input[type="checkbox"]');

        if (!chk.checked) {
            fila.remove();
        }

    });

}

function agregarAlumno(a, origen){

    let tbody = document.querySelector("#tablaAlumnos tbody");

    // ¿Ya existe?
    let existe = tbody.querySelector(`input[value="${a[0]}"]`);
    if (existe) return;

    let checked = alumnosSeleccionados.has(parseInt(a[0])) ? "checked" : "";

    let fila = document.createElement("tr");
    fila.dataset.origen = origen;

    fila.innerHTML = `
        <td><input type="checkbox" value="${a[0]}" ${checked}></td>
        <td>${a[1]}</td>
        <td>${a[2]} ${a[3]}</td>
        <td>${a[4]}</td>
    `;

    tbody.appendChild(fila);

    let checkbox = fila.querySelector('input[type="checkbox"]');
    registrarCheckbox(checkbox);

}

function registrarCheckbox(checkbox) {

    checkbox.addEventListener("change", function () {

        let id = parseInt(this.value);

        console.log("CHANGE", id, this.checked);

        if (this.checked)
            alumnosSeleccionados.add(id);
        else
            alumnosSeleccionados.delete(id);

        console.log(alumnosSeleccionados);

    });

}
 
function conservarMarcados() {

    let filas = document.querySelectorAll("#tablaAlumnos tbody tr");

    filas.forEach(fila => {

        let chk = fila.querySelector('input[type="checkbox"]');

        console.log(
            "CHK",
            chk.value,
            "checked:", chk.checked,
            "set:", alumnosSeleccionados.has(parseInt(chk.value))
        );

        if (!chk.checked) {
            fila.remove();
        }

    });

}   
 
 
function enviar() {

    let seleccionados = [];

    document.querySelectorAll('#tablaAlumnos input[type="checkbox"]:checked')
        .forEach(cb => seleccionados.push(parseInt(cb.value)));

    if (seleccionados.length === 0) {
        alert("Selecciona al menos un alumno");
        return;
    }

    // 🔥 confirmación antes de enviar
    if (!confirm(`Se enviará el código a ${seleccionados.length} alumno(s). ¿Deseas continuar?`)) {
        return;
    }

    fetch("/enviar_codigo_quiz", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            quiz_id: {{ quiz_id }},
            alumnos: seleccionados
        })
    })
    .then(res => res.json())
    .then(data => {
        alert("Correos enviados: " + data.enviados);
    });
}
 
</script>

<script>
function seleccionarVisibles() {

    let filas = document.querySelectorAll("#tablaAlumnos tbody tr");

    filas.forEach(fila => {

        // solo si está visible
        if (fila.style.display !== "none") {
            let checkbox = fila.querySelector('input[type="checkbox"]');
            if (checkbox) checkbox.checked = true;
        }

    });

}
 
 
const inputSalon = document.getElementById("filtroSalon");
const lista = document.getElementById("listaSalones");

inputSalon.addEventListener("input", function() {

    let texto = this.value.trim();

    // 🔥 filtro de alumnos (LO QUE YA FUNCIONA)
    if (texto.length >= 3) {

        fetch(`/buscar_alumnos_por_salon?q=${texto}`)
        .then(res => res.json())
        .then(data => {

        data.forEach(a => agregarAlumno(a));

        });

    }

    // 🔥 sugerencias de salón
    if (texto.length < 3) {
        lista.style.display = "none";
        return;
    }

    fetch(`/buscar_salones?q=${texto}`)
    .then(res => res.json())
    .then(data => {
 
        lista.innerHTML = "";   // <-- Limpiar sugerencias anteriores

        data.forEach(s => {

            let item = document.createElement("div");
            item.className = "list-group-item list-group-item-action";
            item.innerText = s[1];

            item.onclick = () => {

                inputSalon.value = s[1];
                lista.style.display = "none";

                // 🔥 refinar por salón exacto
                fetch(`/buscar_alumnos_por_salon_id?id=${s[0]}`)
                .then(res => res.json())
                .then(alumnos => {

                conservarMarcados();

                alumnos.forEach(a => agregarAlumno(a));

                });

            };

            lista.appendChild(item);

        });

        lista.style.display = "block";

    });

});

const inputAlumno = document.getElementById("filtro");
const listaAlumnos = document.getElementById("listaAlumnos");

    inputAlumno.addEventListener("input", function () {

        let texto = this.value.trim();

        if (texto.length < 4) {
            listaAlumnos.innerHTML = "";
            listaAlumnos.style.display = "none";
            return;
        }

        fetch(`/buscar_alumnos?q=${texto}`)
        .then(res => res.json())
        .then(data => {

            listaAlumnos.innerHTML = "";

            data.forEach(a => {

                let item = document.createElement("div");
                item.className = "list-group-item list-group-item-action";
                item.innerHTML = `<b>${a[1]}</b> - ${a[2]} ${a[3]}`;

                item.onclick = () => {

                    conservarMarcados();

                    console.log("DESPUÉS DE conservar:", document.querySelectorAll("#tablaAlumnos tbody tr").length);

                    agregarAlumno(a, "dni");

                    console.log("DESPUÉS DE agregar:", document.querySelectorAll("#tablaAlumnos tbody tr").length);
                    document.querySelectorAll("#tablaAlumnos tbody tr").forEach(f => {
                        console.log(
                            f.cells[2].innerText,
                            "display:",
                            getComputedStyle(f).display
                        );
                    });
                    inputAlumno.value = "";
                    listaAlumnos.innerHTML = "";
                    listaAlumnos.style.display = "none";
                };

                listaAlumnos.appendChild(item);

            });

            listaAlumnos.style.display = data.length ? "block" : "none";

        });

    });
</script>
 
 
 

{% endblock %}
