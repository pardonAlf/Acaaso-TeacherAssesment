{% extends "base.html" %}

{% block title %}Salones{% endblock %}

{% block content %}

<style>
   .form-control{
    border:1.5px solid #949ba8;
    border-radius:8px;
    transition:all .2s ease;
}

.form-control:hover{
    border-color:#4882ed;
}

.form-control:focus{
    border:2px solid #043a90;
    box-shadow:0 0 0 .18rem rgba(59,130,246,.15);
}
}
</style>

<div class="container mt-4">

    <!-- 🔷 HEADER ESTÁNDAR (MISMO ESTILO QUE QUIZZES) -->
    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between align-items-center">

            <h6 class="mb-0 fw-bold">Salones</h6>

            <button class="btn btn-primary btn-sm" onclick="abrirModalSalon()">
                + Crear
            </button>

        </div>

        <div class="card-body p-0">
          
            <table class="tabla"> 
                <thead class="thead-dashboard">
                    <tr>
                        <th style="width:60px;">ID</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th style="width:100px;">Estado</th>
                        <th style="width:120px;">Quizzes</th>
                        <th style="width:150px;">Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    {% for s in salones %}
                    <tr>
                        <td>{{ s[0] }}</td>
                        <td>{{ s[1] }}</td>
                        <td>{{ s[2] }}</td>

                        <!-- estado bonito -->
                        <td>
                            <span class="badge bg-success">Activo</span>
                        </td>

                        <!-- cantidad quizzes (temporal) -->
                        <td>
                            <span class="badge bg-secondary">
                                {{ s[5] if s|length > 5 else 0 }}
                            </span>
                        </td>

                        <!-- acciones -->
                        <td>
                            <button class="btn btn-sm btn-outline-primary"
                                onclick="editarSalon({{ s[0] }})">
                                Editar
                            </button>

                            <button class="btn btn-sm btn-outline-danger"
                                onclick="eliminarSalon({{ s[0] }})">
                                Eliminar
                            </button>
                        </td>

                    </tr>
                    {% endfor %}
                </tbody>

            </table>

        </div>
    </div>

</div>
<!-- MODAL NUEVO SALÓN -->
<div class="modal fade" id="modalSalon" tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    <i class="fas fa-school text-primary me-2"></i>
                    Nuevo Salón
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3 position-relative ">

                    <label class="form-label">
                        Código
                    </label>

                    <input
                        type="text"
                        id="codigoSalon"
                        autocomplete="off"
                        class="form-control"
                        maxlength="10">

                   

                </div>

                <div class="mb-2">

                    <label class="form-label">
                        Descripción
                    </label>

                    <input
                        type="text"
                        id="descripcionSalon"
                        autocomplete="off"
                        class="form-control">

                </div>

            </div>
            <div id="errorCodigoSalon"
                style="
                    display:none;
                    margin:0 16px 12px 16px;
                    padding:8px 12px;
                    border-radius:6px;
                    background:#dc3545;
                    color:white;
                    font-size:12px;
                    font-weight:600;
                    text-align:left;
                ">
            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-light"
                    data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button
                    class="btn btn-primary"
                    onclick="guardarSalon()">
                    Guardar
                </button>

            </div>

        </div>

    </div>

</div>
<script>

document.getElementById("codigoSalon").addEventListener("input", function () {

    const error = document.getElementById("errorCodigoSalon");

    if (error.style.display === "block") {
        error.style.display = "none";
    }

});

function editarSalon(id) {
    window.location.href = "/editar_salon/" + id;
}

function eliminarSalon(id) {

    Swal.fire({
        title: '¿Eliminar salón?',
        text: "Esta acción no se puede deshacer",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#2563eb',
        cancelButtonColor: '#dc2626',
        confirmButtonText: 'Sí, eliminar',
        cancelButtonText: 'Cancelar'
    }).then((result) => {

        if (result.isConfirmed) {
            window.location.href = "/eliminar_salon/" + id;
        }

    });

}
function abrirModalSalon() {

    document.getElementById("codigoSalon").value = "";
    document.getElementById("descripcionSalon").value = "";

    document.getElementById("errorCodigoSalon").style.display = "none";
    document.getElementById("errorCodigoSalon").innerHTML = "";

    let modal = new bootstrap.Modal(
        document.getElementById("modalSalon")
    );

    modal.show();

    // Dar el foco automáticamente al código
    setTimeout(() => {
        document.getElementById("codigoSalon").focus();
    }, 300);
}

async function guardarSalon() {

    let codigo = document.getElementById("codigoSalon").value.trim();
    let descripcion = document.getElementById("descripcionSalon").value.trim();

    let error = document.getElementById("errorCodigoSalon");

    error.style.display = "none";
    error.innerHTML = "";

    if (!codigo || !descripcion) {
        alert("Complete todos los campos.");
        return;
    }

    const formData = new FormData();
    formData.append("codigo", codigo);
    formData.append("descripcion", descripcion);

    let response = await fetch("/guardar_salon", {
        method: "POST",
        body: formData
    });

    let data = await response.json();

    if (data.status === "error") {

        error.innerHTML = data.mensaje;
        error.style.display = "block";

        document.getElementById("codigoSalon").focus();
        document.getElementById("codigoSalon").select();

        return;
    }

    location.reload();
}   
</script>


{% endblock %}
